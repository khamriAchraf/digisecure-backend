name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    environment: .env.test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          pip install poetry

      - name: Install dependencies
        run: poetry install --no-root

      - name: Create .env.test file
        run: |
          cat <<EOF > app/core/.env.test
          DB_HOST=${{ secrets.DB_HOST }}
          DB_PORT=${{ secrets.DB_PORT }}
          DB_USER=${{ secrets.DB_USER }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          DB_NAME=${{ secrets.DB_NAME }}
          DB_SCHEMA=${{ secrets.DB_SCHEMA }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          JWT_ALGORITHM=${{ secrets.JWT_ALGORITHM }}
          JWT_EXPIRATION_MINUTES=${{ secrets.JWT_EXPIRATION_MINUTES }}
          JWT_REFRESH_EXPIRATION_DAYS=${{ secrets.JWT_REFRESH_EXPIRATION_DAYS }}
          EOF

      - name: Download GeoLite2 City database
        run: |
          mkdir -p data
          curl -L "https://download.maxmind.com/geoip/databases/GeoLite2-City/download?suffix=tar.gz" -o data/GeoLite2-City.mmdb

      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Run tests on remote server
        env:
          SSH_HOST: ${{ secrets.REMOTE_HOST }}
          SSH_USER: ${{ secrets.REMOTE_USER }}
          SSH_PASS: ${{ secrets.REMOTE_PASSWORD }}
        run: |
          set -e
          echo "Running CI remotely on $SSH_HOST"

          # Define test folder
          TEST_DIR=~/ci_test

          # Clone or update repo on remote server, then run tests
          sshpass -p "$SSH_PASS" ssh -o StrictHostKeyChecking=no $SSH_USER@$SSH_HOST "
            set -e
            mkdir -p $TEST_DIR
            cd $TEST_DIR

            if [ -d .git ]; then
              git fetch --all
              git reset --hard origin/main
            else
              git clone https://github.com/khamriAchraf/backend.git .
            fi

            export DB_PASSWORD='${DB_PASSWORD}'
            export JWT_SECRET='${JWT_SECRET}'

            chmod +x do_tests.sh
            ./do_tests.sh
          "