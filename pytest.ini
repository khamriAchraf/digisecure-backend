[pytest]
markers =
    unit: Unit tests that test individual functions in isolation
    e2e: End-to-end tests that test how components work together
    slow: Tests that take longer to run

testpaths = tests

# Default options for all test runs
addopts = 
    --tb=short 
    --cov=app
    --cov-report=term-missing
    --cov-report=html:htmlcov
