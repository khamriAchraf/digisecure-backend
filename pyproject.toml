[tool.poetry]
name = "backend"
version = "0.1.0"
description = "Backend server for the XXX project"
authors = ["khamri.Achraf <achrafkhamri99@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115.13"
uvicorn = {extras = ["standard"], version = "^0.34.3"}
sqlalchemy = "^2.0.41"
alembic = "^1.16.2"
pydantic-settings = "^2.10.0"
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
python-jose = "^3.5.0"
asyncpg = "^0.30.0"
pydantic = {extras = ["email"], version = "^2.11.7"}
psycopg2-binary = "^2.9.10"
python-multipart = "^0.0.20"
bcrypt = "4.0.1"


[tool.poetry.group.dev.dependencies]
pytest = "^8.4.1"
pytest-asyncio = "^1.0.0"
httpx = "^0.28.1"
black = "^25.1.0"
isort = "^6.0.1"
ruff = "^0.12.0"
pytest-cov = "^6.2.1"
trio = "^0.30.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
